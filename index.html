<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Viu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
body{font-family:'Cairo';background:linear-gradient(135deg,#f5efe6,#e8f0fe,#ffe4ec);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#ffffffdd;border-radius:28px;max-width:420px;width:100%;padding:32px 26px;text-align:center;box-shadow:0 20px 50px #0001;border:1.5px solid #e0d6cc}
h1{color:#6a7fb5;margin:0 0 8px} .sub{color:#a89f94;font-size:13px;margin-bottom:20px;line-height:1.7}
input,textarea{width:100%;background:#fcfaf7;border:1.5px solid #e9e0d6;border-radius:14px;padding:12px;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
.btn{background:linear-gradient(90deg,#a7c7e7,#f8a8c2);color:white;border:none;border-radius:14px;padding:13px;width:100%;font-weight:700;cursor:pointer}
.linkBox{background:#fcfaf7;border:1.5px dashed #a7c7e7;border-radius:14px;padding:12px;margin-top:14px;word-break:break-all;font-size:12px;display:none}
.badge{display:inline-block;background:#e8f0fe;color:#6a7fb5;padding:4px 12px;border-radius:20px;font-size:11px;margin-bottom:10px}
</style>
</head>
<body>
<div class="card" id="c">
<div style="font-size:30px">💌</div>
<div class="badge">For Viu - 20 years</div>
<h1>رسالة لـ Viu</h1>
<p class="sub">اعملي رسالة سرية</p>
<input id="to" value="To Viu 🤍">
<textarea id="m" rows="4" placeholder="اكتبي رسالتك لـ Viu هنا..."></textarea>
<button class="btn" onclick="gen()">اعملي اللينك بـ باسورد 1719 ✨</button>
<div id="r" class="linkBox"></div>
</div>

<div class="card" id="v" style="display:none">
<div style="font-size:30px">💙</div>
<div class="badge">رسالة سرية</div>
<h1 id="vt"></h1>
<p id="vm" style="display:none;font-size:17px;line-height:2;white-space:pre-wrap"></p>
<div id="lk">
<p class="sub">الرسالة مقفولة يا Viu 🔒<br><b style="color:#6a7fb5">تلميح: السن اللي عرفتك فيه والسن اللي عرفتيني فيه بالترتيب 😉</b></p>
<input id="p" type="password" placeholder="اكتبي الباسورد">
<button class="btn" onclick="openM()">افتحي يا Viu 🔓</button>
<p id="er" style="color:#e07a9a;display:none;font-size:12px;margin-top:8px">غلط يا Viu، فكري في السن 💭</p>
</div>
</div>

<script>
const PWD="1719";
let h=location.hash.slice(1);
if(h){
document.getElementById('c').style.display='none';
document.getElementById('v').style.display='block';
}
function gen(){
let t=document.getElementById('to').value;
let ms=document.getElementById('m').value;
if(!t||!ms){alert('اكتبي الرسالة');return}
let data=btoa(unescape(encodeURIComponent(JSON.stringify({to:t,msg:ms}))));
let link=location.href.split('#')[0]+'#'+data;
document.getElementById('r').style.display='block';
document.getElementById('r').innerHTML='جاهز 💙<br><br><b style=color:#6a7fb5>'+link+'</b><br><br>الباسورد: 1719<br><br><button class=btn onclick=navigator.clipboard.writeText(`'+link+'`)>انسخي اللينك</button>';
}
function openM(){
let val=document.getElementById('p').value.trim();
if(val!==PWD){document.getElementById('er').style.display='block';return}
try{
let d=JSON.parse(decodeURIComponent(escape(atob(h))));
document.getElementById('vt').innerText=d.to;
document.getElementById('vm').innerText=d.msg;
document.getElementById('vm').style.display='block';
document.getElementById('lk').style.display='none';
}catch(e){document.getElementById('er').style.display='block';}
}
</script>
</body>
</html>
